name: Qogita Refresher

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run Qogita scraper
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          PROXY: ${{ secrets.PROXY }}
          PYTHONUNBUFFERED: "1"
        run: python refresh.py

      - name: Commit updated JSON files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add products.json category_state.json || true
          git diff --cached --quiet || git commit -m "Update products and state [auto]"
          git push
